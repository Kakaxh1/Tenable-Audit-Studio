<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="badge-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="tas-text-grad" x1="10" y1="10" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="border-glow" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Container Box with Rounded Chamfer / Tech Radius -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="12" fill="url(#badge-bg)" stroke="#27272a" stroke-width="1.5"/>
  <rect x="3" y="3" width="42" height="42" rx="10" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Code Syntax Terminal Brackets -->
  <path d="M 12 17 L 7 23 L 12 29" stroke="#6366f1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 36 17 L 41 23 L 36 29" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Main Monogram Code Text -->
  <text x="24" y="26" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="10.5" font-weight="800" fill="url(#tas-text-grad)" text-anchor="middle" letter-spacing="-0.3">TAS</text>

  <!-- Subtext .audit file extension indicator -->
  <text x="24" y="36.5" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="6.5" font-weight="700" fill="#71717a" text-anchor="middle" letter-spacing="0.5">.audit</text>

  <!-- Top Right Mini Compliance Verified Pip -->
  <circle cx="39" cy="9" r="2.5" fill="#10b981"/>
  <circle cx="39" cy="9" r="1" fill="#ecfdf5"/>
</svg>
